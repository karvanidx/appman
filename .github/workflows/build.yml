name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > appman.keystore
            echo "Using KEYSTORE_B64"
          else
            echo "No KEYSTORE_B64 secret: build.sh will generate a temporary keystore"
          fi

      - name: Build
        run: |
          export ANDROID_JAR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
          export PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0:$PATH"
          chmod +x build.sh tools/mkapk.py
          ./build.sh
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appman-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
