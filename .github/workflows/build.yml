name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform + build-tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK"
          find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null || true
          SDKMGR=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > appman.keystore
            echo "Using KEYSTORE_B64"
          else
            echo "No KEYSTORE_B64 secret: build.sh will generate a temporary keystore"
          fi

      - name: Build
        run: |
          export ANDROID_JAR="$ANDROID_SDK/platforms/android-36/android.jar"
          export PATH="$ANDROID_SDK/build-tools/36.0.0:$PATH"
          chmod +x build.sh tools/mkapk.py
          bash build.sh
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: appman-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
